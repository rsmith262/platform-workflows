name: Reusable deploy

on:
  workflow_call:
    inputs:
      environment:
        description: Which environment to deploy to
        required: true
        type: string
      artifact-name:
        description: Name of the uploaded artifact to deploy
        required: false
        type: string
        default: release

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}

      - name: Show what resolved here
        run: |
          echo "environment input: ${{ inputs.environment }}"
          echo "resource group:    ${{ vars.AZURE_RESOURCE_GROUP }}"
          echo "client id ends:    ...${CID: -6}"
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" \
            | jq -r .value)
          python3 -c "
          import base64, json, sys
          p = sys.argv[1].split('.')[1]
          c = json.loads(base64.urlsafe_b64decode(p + '=' * (-len(p) % 4)))
          print('subject claim:    ' + c['sub'])
          " "$TOKEN"
        env:
          CID: ${{ vars.AZURE_CLIENT_ID }}

      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        run: |
          cat release.txt
          az tag update \
            --resource-id /subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/resourceGroups/${{ vars.AZURE_RESOURCE_GROUP }} \
            --operation merge --tags deployedSha=${{ github.sha }}
